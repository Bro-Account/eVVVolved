# Continuous build for Linux, the counterpart of windows.yml.
#
# Builds both architectures the Linux targets come in:
#   arm64 - native ubuntu-24.04-arm runner, matches the Raspberry Pi target
#   x64   - regular ubuntu-24.04 runner
# Upstream Firebird 2.5 has no Linux arm64/amd64 port; the bundled conversion
# helper is assembled from Debian 8 (jessie) native packages by
# scripts/fetch-firebird25.sh, so unlike the Windows artifact these do
# include the helper. Dependency provisioning lives in
# scripts/fetch-linux-deps.sh on purpose: it is the same script used for
# local setup. The artifacts need the distribution wxWidgets/TagLib
# libraries at run time, like a locally built tree.
name: linux-build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Provision dependencies
        run: ./scripts/fetch-linux-deps.sh

      - name: Build and stage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install"
          cmake --build build -j4
          cmake --install build

      - name: Smoke test
        run: |
          test -x build/install/vvv
          test -x build/install/vvv-start.sh
          # no unresolved shared libraries in the binary itself
          if ldd build/install/vvv | grep "not found"; then
            echo "vvv has unresolved libraries" >&2; exit 1
          fi
          # the bundled Firebird 5 embedded engine works end-to-end
          export LD_LIBRARY_PATH="$PWD/build/install/firebird/lib"
          export FIREBIRD="$PWD/build/install/firebird"
          cat > /tmp/smoke.sql <<'EOF'
          CREATE DATABASE '/tmp/smoke.fdb';
          CREATE TABLE T (I INTEGER);
          INSERT INTO T VALUES (42);
          COMMIT;
          QUIT;
          EOF
          build/install/firebird/bin/isql -q -user SYSDBA -password masterkey \
            -i /tmp/smoke.sql
          printf 'SELECT I FROM T;\nQUIT;\n' > /tmp/q.sql
          build/install/firebird/bin/isql -q -user SYSDBA -password masterkey \
            /tmp/smoke.fdb -i /tmp/q.sql -o /tmp/q.out
          grep -q 42 /tmp/q.out
          # the Firebird 2.5 helper reports its version and performs the
          # actual conversion chain the app uses on old catalogs:
          # create ODS 11.2 -> helper gbak backup -> Firebird 5 restore
          v="$(build/install/firebird-2.5/bin/gbak -z 2>&1 | head -1)"
          echo "$v"
          case "$v" in
            *LI-V2.5.3.26778*) ;;
            *) echo "unexpected helper version: $v" >&2; exit 1 ;;
          esac
          cat > /tmp/old.sql <<'EOF'
          CREATE DATABASE '/tmp/old.fdb';
          CREATE TABLE F (I INTEGER);
          INSERT INTO F VALUES (7);
          COMMIT;
          QUIT;
          EOF
          build/install/firebird-2.5/bin/isql -q -user SYSDBA -password masterkey \
            -i /tmp/old.sql
          build/install/firebird-2.5/bin/gbak -b -g /tmp/old.fdb /tmp/old.fbk \
            -user SYSDBA -password masterkey
          build/install/firebird/bin/gbak -c /tmp/old.fbk /tmp/new.fdb \
            -user SYSDBA -password masterkey
          printf 'SELECT I FROM F;\nQUIT;\n' > /tmp/q2.sql
          build/install/firebird/bin/isql -q -user SYSDBA -password masterkey \
            /tmp/new.fdb -i /tmp/q2.sql -o /tmp/q2.out
          grep -q 7 /tmp/q2.out

      - name: Pack artifact
        run: tar -czf "vvv-linux-${{ matrix.arch }}.tar.gz" -C build/install .

      - name: Upload vvv-linux-${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: vvv-linux-${{ matrix.arch }}
          path: vvv-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
